name: CI — Build, Test & Deploy

on:
  push:
    branches: [ kite_v1 ]
  pull_request:
    branches: [ kite_v1 ]

jobs:
  # ─── Job 1: Build & Test ────────────────────────────────────────────────────
  build:
    name: Build with Java 17 + Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: xchangepractice
        run: ./mvnw verify -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-sipper-jar
          path: xchangepractice/target/*.jar
          retention-days: 7

  # ─── Job 2: Deploy to Railway ───────────────────────────────────────────────
  # Runs only on direct pushes to kite_v1 (not on pull requests).
  #
  # Prerequisites — add these secrets in GitHub repo settings
  # (Settings → Secrets and variables → Actions → New repository secret):
  #
  #   RAILWAY_TOKEN   — your Railway API token
  #                     (Railway dashboard → Account Settings → Tokens → New Token)
  #   RAILWAY_SERVICE — the Railway service ID or name to deploy
  #                     (optional; omit if the project has only one service)
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build                  # only deploy after a successful build
    if: github.event_name == 'push' && github.ref == 'refs/heads/kite_v1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: xchangepractice
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach
