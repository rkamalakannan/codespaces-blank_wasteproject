name: CI — Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build with Java 17 + Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: xchangepractice
        run: ./mvnw verify -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-sipper-jar
          path: xchangepractice/target/*.jar
          retention-days: 7
