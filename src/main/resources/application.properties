server.port = 8090
server.forward-headers-strategy = native

# ==================== Spring Boot Actuator for Health Checks ====================
management.endpoints.web.exposure.include = health,info
management.endpoint.health.show-details = always

# Swagger/OpenAPI UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true




# ==================== Trading Scheduler Configuration ====================
# Enable/disable scheduled trading (set to true to enable)
trading.scheduler.enabled=true

# Polling interval in milliseconds (default: 30 seconds)
# Recommended values:
# - 30000ms (30 seconds): Balanced for most crypto markets
# - 15000ms (15 seconds): High volatility periods
# - 60000ms (1 minute): Low volatility / rate limit protection
trading.scheduler.interval-ms=30000

# Default amount for automated trades
trading.default-amount=0.01

# Maximum concurrent positions allowed
trading.max-positions=3

# Active assets to trade (comma-separated list)
trading.active-assets=BTC,MATIC,BCH,LTC,KSM,GMT

# ==================== Protective Orders Scheduler Configuration ====================
# Interval in milliseconds for the protective orders check (stop-loss + take-profit enforcement).
# Should be LONGER than trading.scheduler.interval-ms to give the exchange time to confirm orders.
# Default: 150000ms (2.5 minutes = 5x the default 30s trading interval)
trading.protective-orders.interval-ms=150000

# ==================== Stop-Loss / Take-Profit Configuration ====================
# Percentage distance from entry price for stop-loss orders.
# Default: 2.0 (2%). Must be > 0. Recommended: 2-3% for crypto volatility.
# Examples:
#   1.0  = 1.0% below/above entry price
#   2.0  = 2.0% below/above entry price (default)
#   3.0  = 3.0% below/above entry price
trading.stop-loss-percent=2.0

# Percentage distance from entry price for take-profit orders (fallback when prediction unavailable).
# Default: 2.0 (2%). Must be > 0.
trading.take-profit-percent=2.0

# ==================== Arbitrage Strategy Configuration ====================
# Minimum spread percentage between spot and futures to trigger a trade.
# Must be larger than total fees to be profitable.
# Kraken Futures fees: ~0.02% maker + ~0.05% taker = ~0.07% total
# Kraken Spot fees: ~0.16% maker + ~0.26% taker = ~0.42% total
# Total round-trip: ~0.5% minimum
# Default: 0.5 (0.5%). Set higher for safety margin.
# Examples:
#   0.3  = 0.3% minimum spread (risky - barely covers fees)
#   0.5  = 0.5% minimum spread (default - small safety margin)
#   1.0  = 1.0% minimum spread (conservative - good safety margin)
trading.min-spread-percent=0.5

# ==================== Open Order Expiry Configuration ====================
# Time in milliseconds after which an unfilled open order is automatically cancelled.
# Default: 300000ms (5 minutes). Set to 0 to disable automatic cancellation.
# Examples:
#   60000   = 1 minute
#   300000  = 5 minutes (default)
#   600000  = 10 minutes
trading.order.expiry-ms=300000

# ==================== Kraken API Configuration ====================
# Set to true for sandbox/testing, false for production
kraken.sandbox.enabled=false

