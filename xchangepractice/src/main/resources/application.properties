# ─────────────────────────────────────────────────────────────────────────────
# Crypto Sipper — Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Railway injects the PORT environment variable automatically.
# Fallback to 8080 for local development.
server.port=${PORT:8080}

# Application name (shown in logs and actuator)
spring.application.name=crypto-sipper

# ─── Logging ─────────────────────────────────────────────────────────────────
# INFO level for the app; reduce XChange HTTP noise to WARN
logging.level.root=INFO
logging.level.com.hope.xchangepractice=DEBUG
logging.level.org.knowm.xchange=WARN
logging.level.org.ta4j=WARN

# ─── Jackson (JSON serialisation) ────────────────────────────────────────────
# Serialise BigDecimal as plain numbers (not scientific notation)
spring.jackson.serialization.write-bigdecimal-as-plain=true
# Include non-null fields only
spring.jackson.default-property-inclusion=non_null
# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# ─── Actuator — service management endpoints ───────────────────────────────
# Expose health, info, and shutdown endpoints
management.endpoints.web.exposure.include=health,info,shutdown
# Enable shutdown endpoint (POST /actuator/shutdown to stop service)
management.endpoint.shutdown.enabled=true
# Require authentication for shutdown endpoint (set to false for easy testing)
management.endpoint.shutdown.sensitive=false
# Show detailed health information
management.endpoint.health.show-details=always
# Custom health endpoint path
management.endpoints.web.base-path=/api/manage
